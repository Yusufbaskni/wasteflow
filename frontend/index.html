<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atık Takip Sistemi</title>
    <link rel="icon" type="image/png" href="./istinye-icon.png" />
    <script>
      // css tema flash olmasın diye react'ten önce.
      try {
        var t = localStorage.getItem("wasteflow.theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/baslat.jsx"></script>
  </body>
</html>
